name: st_saathi
description: "Offline Maharashtra ST bus timetable for Android. No data or signal needed."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.4+2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  package_info_plus: ^8.3.0
  sqflite_common_ffi: ^2.4.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/database/st_timetable.db

  fonts:
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400

    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
